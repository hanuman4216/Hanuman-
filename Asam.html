<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Animated Website</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:linear-gradient(-45deg,#000428,#004e92,#0f2027,#2c5364);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
font-weight:bold;
z-index:9999;
animation:hideLoader 3s forwards;
}

@keyframes hideLoader{
0%,80%{opacity:1;}
100%{opacity:0;visibility:hidden;}
}

.container{
text-align:center;
z-index:10;
}

h1{
font-size:60px;
text-shadow:0 0 20px cyan;
animation:float 3s infinite ease-in-out;
}

p{
margin:20px;
font-size:22px;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:40px;
background:cyan;
cursor:pointer;
box-shadow:0 0 20px cyan;
transition:.3s;
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 50px cyan;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-20px);}
}

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.15);
animation:floatCircle linear infinite;
}

@keyframes floatCircle{
0%{
transform:translateY(100vh) rotate(0deg);
}
100%{
transform:translateY(-150px) rotate(360deg);
}
}
</style>
</head>

<body>

<div id="loader">Loading...</div>

<div class="container">
<h1>🚀 Welcome</h1>
<p>Ultra Animated Website</p>
<button onclick="showMsg()">Click Me</button>
</div>

<script>
function showMsg(){
alert("Welcome to your animated website!");
}
// Floating Particles
for(let i=0;i<40;i++){
    const c=document.createElement("div");
    c.className="circle";

    const size=Math.random()*40+10;
    c.style.width=size+"px";
    c.style.height=size+"px";
    c.style.left=Math.random()*100+"%";
    c.style.animationDuration=(Math.random()*10+8)+"s";
    c.style.animationDelay=Math.random()*5+"s";

    document.body.appendChild(c);
}

// Mouse Glow Effect
const glow=document.createElement("div");
glow.style.position="fixed";
glow.style.width="30px";
glow.style.height="30px";
glow.style.borderRadius="50%";
glow.style.pointerEvents="none";
glow.style.background="rgba(0,255,255,.5)";
glow.style.boxShadow="0 0 40px cyan";
glow.style.transform="translate(-50%,-50%)";
document.body.appendChild(glow);

document.addEventListener("mousemove",e=>{
    glow.style.left=e.clientX+"px";
    glow.style.top=e.clientY+"px";
});
// Click Effect
document.addEventListener("click",function(e){
    let spark=document.createElement("div");

    spark.style.position="fixed";
    spark.style.left=e.clientX+"px";
    spark.style.top=e.clientY+"px";
    spark.style.width="15px";
    spark.style.height="15px";
    spark.style.borderRadius="50%";
    spark.style.background="cyan";
    spark.style.boxShadow="0 0 30px cyan";
    spark.style.pointerEvents="none";
    spark.style.transition="all 0.8s ease";

    document.body.appendChild(spark);

    setTimeout(()=>{
        spark.style.transform="scale(8)";
        spark.style.opacity="0";
    },10);

    setTimeout(()=>{
        spark.remove();
    },800);
});

// Welcome Message
setTimeout(()=>{
    console.log("🚀 Website Loaded Successfully!");
},3000);

</script>

</body>
</html>
