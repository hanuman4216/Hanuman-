<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Bootstrap Utility Classes</title>
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="text-center mb-5">
        <h1 class="text-primary fw-bold">Bootstrap Utility Classes</h1>
        <p class="text-muted">Complete Bootstrap Example</p>
    </div>

    <div class="card shadow-lg rounded-4 p-4">
        <h3 class="text-success">Student Information</h3>
        <p class="text-secondary">
            This page demonstrates Bootstrap utility classes.
        </p>

        <div class="d-flex gap-3 mt-3">
            <button class="btn btn-primary">Save</button>
            <button class="btn btn-success">Update</button>
            <button class="btn btn-danger">Delete</button>
        </div>
    </div>

    <div class="mt-5">
        <h3 class="text-center">Flex Example</h3>

        <div class="d-flex justify-content-between mt-3">
            <div class="bg-primary text-white p-3 rounded">Box 1</div>
            <div class="bg-success text-white p-3 rounded">Box 2</div>
            <div class="bg-danger text-white p-3 rounded">Box 3</div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-4">
            <div class="bg-primary text-white p-4 rounded shadow">Column 1</div>
        </div>

        <div class="col-md-4">
            <div class="bg-warning p-4 rounded shadow">Column 2</div>
        </div>

        <div class="col-md-4">
            <div class="bg-info text-white p-4 rounded shadow">Column 3</div>
        </div>
    </div>

    <div class="border border-danger border-3 rounded p-4 mt-5">
        <h3 class="text-danger">Border Utility</h3>
        <p>This box uses Bootstrap border utilities.</p>
    </div>

    <div class="mt-5">
        <div class="bg-success text-white w-50 p-3 mb-3">
            Width 50%
        </div>

        <div class="bg-primary text-white w-75 p-3">
            Width 75%
        </div>
    </div>

    <div class="text-center mt-5">
        <button class="btn btn-lg btn-primary rounded-pill px-5">
            Get Started
        </button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
