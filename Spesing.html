<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animation Demo</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    gap:25px;
}

/* Fade Up */
.fade{
    animation:fadeUp 2s infinite;
}

@keyframes fadeUp{
    0%{
        opacity:0;
        transform:translateY(20px);
    }
    50%{
        opacity:1;
        transform:translateY(0);
    }
    100%{
        opacity:0;
        transform:translateY(-20px);
    }
}

/* Typing Effect */
.typing{
    color:crimson;
    width:13ch;
    overflow:hidden;
    white-space:nowrap;
    border-right:3px solid #fff;
    animation:typing 4s steps(13) infinite,
              blink .6s infinite;
}

@keyframes typing{
    from{width:0;}
    to{width:13ch;}
}

@keyframes blink{
    50%{border-color:transparent;}
}

/* Gradient Text */
.gradient{
    background:linear-gradient(90deg,#00f,#0ff,#f0f,#00f);
    background-size:300%;
    background-clip:text;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradientFlow 4s linear infinite;
}

@keyframes gradientFlow{
    from{background-position:0%;}
    to{background-position:300%;}
}

/* Neon */
.neon{
    color:#00bfff;
    animation:neon 1.5s infinite alternate;
}

@keyframes neon{
    from{
        text-shadow:0 0 5px #00bfff;
    }
    to{
        text-shadow:0 0 10px #00bfff,
                    0 0 20px #002c3b,
                    0 0 40px #ecf0f2;
    }
}

/* Wave */
.wave span{
    display:inline-block;
    animation:wave 1.2s infinite;
}

.wave span:nth-child(1){animation-delay:.1s;}
.wave span:nth-child(2){animation-delay:.2s;}
.wave span:nth-child(3){animation-delay:.3s;}
.wave span:nth-child(4){animation-delay:.4s;}
.wave span:nth-child(5){animation-delay:.5s;}
.wave span:nth-child(6){animation-delay:.6s;}
.wave span:nth-child(7){animation-delay:.7s;}
.wave span:nth-child(8){animation-delay:.8s;}
.wave span:nth-child(9){animation-delay:.9s;}
.wave span:nth-child(10){animation-delay:1s;}
.wave span:nth-child(11){animation-delay:1.1s;}
.wave span:nth-child(12){animation-delay:1.2s;}

@keyframes wave{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-15px);
    }
}
</style>

</head>
<body>

<h1 class="fade">Fade Up Animation</h1>

<h1 class="typing">Typing Effect</h1>

<h1 class="gradient">Gradient Text</h1>

<h1 class="neon">Neon Light</h1>

<h1 class="wave">
    <span>H</span>
    <span>E</span>
    <span>L</span>
    <span>L</span>
    <span>O</span>
    <span>&nbsp;</span>
    <span>W</span>
    <span>O</span>
    <span>R</span>
    <span>L</span>
    <span>D</span>
    <span>!</span>
</h1>

</body>
</html>
